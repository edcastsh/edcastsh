name: Generate GitHub profile cards

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-summary-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: edcastsh
          BRANCH_NAME: main
          TIME_ZONE: America/Mazatlan
          AUTO_PUSH: false

      - name: Commit and push generated cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/
          if git diff --cached --quiet; then
            echo "No profile card changes to commit."
            exit 0
          fi
          git commit -m "chore: update GitHub profile summary cards"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Profile cards pushed successfully."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push failed; retrying after fetching main (attempt $attempt/3)." >&2
              sleep 2
            fi
          done
          echo "Unable to push profile cards after 3 attempts." >&2
          exit 1

name: Generate GitHub profile cards

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: profile-summary-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: edcastsh
          BRANCH_NAME: main
          TIME_ZONE: America/Mazatlan
          AUTO_PUSH: false

      - name: Open or update profile cards pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update GitHub profile summary cards"
          branch: automation/update-profile-cards
          base: main
          delete-branch: true
          add-paths: |
            profile-summary-card-output/**
          title: "chore: update GitHub profile summary cards"
          body: |
            Automated daily refresh of GitHub profile summary cards.
            This PR is required because the main branch does not allow direct pushes.
